<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سوبر ماركت الصعيدي</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f6f7f9;color:#151515}
header{background:#fff;padding:22px 18px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:5}
.wrap{max-width:900px;margin:auto}
.brand{font-size:28px;font-weight:800}
.sub{color:#666;margin-top:5px}
.notice{margin:28px auto;background:#fff;border-radius:20px;padding:35px 22px;text-align:center;box-shadow:0 8px 30px #0000000d}
.icon{font-size:48px}
.notice h1{font-size:27px;margin:12px 0}
.notice p{font-size:17px;color:#666;line-height:1.8}
.areas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.area{background:#f0f1f3;padding:10px 16px;border-radius:999px;font-weight:700}
footer{color:#777;text-align:center;padding:25px}
</style>
</head>
<body>
<header>
<div class="wrap">
<div class="brand">🛒 سوبر ماركت الصعيدي</div>
<div class="sub">طلبات البقالة والتوصيل</div>
</div>
</header>

<main class="wrap">
<section class="notice">
<div class="icon">🛍️</div>
<h1>الموقع مغلق مؤقتًا</h1>
<p>نقوم حاليًا بتجهيز المنتجات والأسعار. سيصبح الموقع متاحًا للطلب بعد الانتهاء من إضافة جميع المنتجات.</p>
<p><strong>التوصيل متاح فقط في:</strong></p>
<div class="areas">
<span class="area">الجيزة</span>
<span class="area">البدرشين</span>
</div>
</section>
</main>

<footer>سوبر ماركت الصعيدي</footer>
</body>
</html>
